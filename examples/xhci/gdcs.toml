# SPDX-License-Identifier: Apache-2.0
# GDCS declaration: what the Godspeed Driver Conformance Suite (godspeed-gdcs) reads to test this driver.
# It is the driver author's, kept beside the source. Not needed to build or package the driver; only to test it.

format = 1

# The GodspeedOS release this driver is built and tested against. GDCS checks it against the platform file and
# image it is given and refuses to start on a mismatch, so a test against the wrong release is caught up front.
[target]
os = "0.31.0"

# What QEMU must be given to exercise the driver, beyond the disks and network card GDCS always adds: an xHCI host
# and two devices on it, so there is something on its ports to find.
[qemu]
devices = ["qemu-xhci,id=xhci", "usb-kbd,bus=xhci.0", "usb-mouse,bus=xhci.0"]

# Not on riscv64: there the machine's disk is a USB stick, and the xHCI the OS drives is the one it is on. A package
# that takes the xHCI class over would take the disk away from `fs` mid-run, which tests nothing about this driver.
[qemu.riscv64]
unsupported = "the machine's disk is on the xHCI this driver would take over"

# What the driver claims to do: a line it logs when it has done its job, which GDCS waits for after installing
# it (Stage 3). A functional pass covers only what is declared here: two devices found, by registers alone.
[[behaviour]]
id = "reset-and-ports"
expect = "reset OK, 2 port(s) with a device"
within-secs = 30
