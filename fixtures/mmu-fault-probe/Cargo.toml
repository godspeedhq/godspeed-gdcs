[package]
name = "mmu-fault-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mmu-fault-probe"
path = "src/main.rs"

[dependencies]
# The Godspeed standard library, at the OS release this project was created against.
godspeed = { git = "https://github.com/godspeedhq/godspeed-os", tag = "v0.31.0" }
# The SDK, same tag, for `adversarial::fault_null_read`: a deliberate ring-3 fault, the one thing a
# conformance probe needs that a safe wrapper cannot express. A model service would never call it.
godspeed-sdk = { git = "https://github.com/godspeedhq/godspeed-os", tag = "v0.31.0" }

# This project is its own workspace, wherever it is created.
[workspace]

# A service has no unwinder: a panic ends the service, and the supervisor sees it die.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
